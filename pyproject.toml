[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ECGProcess"
version = "1.2.0"
description = "A python module to process and standardise ECG data"
readme = "README.md"
authors = [
    {name = "A. Floriaan Schmidt", email = "floriaanschmidt@gmail.com"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENCE.txt"]
requires-python = ">=3.11, <3.15"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy"
]

[project.urls]
Homepage = "https://gitlab.com/SchmidtAF/ECGProcess"
Documentation = "https://SchmidtAF.gitlab.io/ECGProcess/"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }
tensorflow = { file = ["requirements-tensorflow.txt"] }
wfdb = { file = ["requirements-wfdb.txt"] }
all = { file = ["requirements-tensorflow.txt", "requirements-wfdb.txt"] }

[tool.setuptools.packages.find]
include = ["ecgprocess*"]
exclude = ["tests", "*.tests", "*.tests.*", "tests.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ecgprocess" = ["*.md", "*.txt", "*.rst", "*.xsd", "*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tensorflow: test requires the optional tensorflow dependency",
    "wfdb: test requires the optional wfdb dependency",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.pyright]
# the conda env NAME is shared; its parent directory is machine-specific
# and must be supplied per user as `venvPath` in the editor settings
# (e.g. coc-settings/VS Code "python.venvPath": "~/miniforge3/envs")
venv = "ECGProcess"
pythonVersion = "3.11"
