[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ECGProcess"
version = "1.0.1"
description = "A python module to process and standardise ECG data"
readme = "README.md"
authors = [
    {name = "A. Floriaan Schmidt", email = "floriaanschmidt@gmail.com"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENCE.txt"]
requires-python = ">=3.11, <3.14"
dynamic = ["dependencies", "optional-dependencies"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: PyPy"
]

[project.urls]
Homepage = "https://gitlab.com/SchmidtAF/ECGProcess"
Documentation = "https://SchmidtAF.gitlab.io/ECGProcess/"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
include = ["ecgprocess*"]
exclude = ["tests", "*.tests", "*.tests.*", "tests.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ecgprocess" = ["*.md", "*.txt", "*.rst"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
