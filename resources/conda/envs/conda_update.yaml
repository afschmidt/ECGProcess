channels:
  - anaconda
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - lxml>=5
  - xmltodict>=0.14
  - pandas>=2.1.1
  - numpy>=1.26
  - scipy>=1.7
  - pydicom>=2.0
  - matplotlib>=3.9
  # tensorflow is an optional runtime dependency (tfrecord writer only);
  # it is installed here so the dev environment can run the full test suite
  - tensorflow>=2.16
  # wfdb is an optional runtime dependency (wfdb writer only); it is
  # installed here so the dev environment can run the full test suite
  - wfdb>=4.3.1,<5
  - pytest>=6
  - pytest-mock>=3.0
  - pytest-dependency>=0.5
  - bump2version>=1.*
  - codespell
  - ruff
  - build
  - conda-build>=3
  - twine
  - sphinx
  - sphinx_rtd_theme
  - sphinx_bootstrap_theme
  - furo
  - myst-parser
  - nbsphinx
  - nbsphinx-link
  - sphinx-argparse
  - numpydoc
  - docutils<0.21
  - pip
  - jupyter
